<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-plugin-git-commit-push">
  <title>dsh-plugin-git-commit-push</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#3550DC"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- push: the arrow leaving the commit -->
  <path d="M32 9v13" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M24.5 16.5 32 9l7.5 7.5" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- commit: node on the branch -->
  <path d="M32 47v8" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="9.5" fill="#ffffff"/>
  <circle cx="32" cy="38" r="4" fill="#3550DC"/>
</svg>
